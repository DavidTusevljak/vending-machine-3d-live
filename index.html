<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vending Machine 3D</title>
  <style>
    :root{
      --bg1:#13263d;
      --bg2:#090f16;
      --metal1:#edf3f9;
      --metal2:#c2ced9;
      --metal3:#7e8b98;
      --panel:#1a2330;
      --panel2:#2d3745;
      --glass:rgba(134,210,255,0.18);
      --glow:rgba(125,232,255,0.95);
      --shadow:rgba(0,0,0,0.52);
      --red1:#ef5b5b;
      --red2:#a90d0d;
      --orange1:#ffc86b;
      --orange2:#ff8e28;
      --blue1:#7ecdfd;
      --blue2:#2d7fe0;
      --green1:#8cf6c6;
      --green2:#20a765;
      --dark:#0a1118;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 10%, #2d4f7b 0%, #182b42 20%, #08131d 48%, #050c12 100%);
      font-family: Arial, Helvetica, sans-serif;
      color:white;
    }

    body{
      display:grid;
      place-items:center;
    }

    .scene{
      position:relative;
      width:100%;
      height:100vh;
      display:grid;
      place-items:center;
      perspective:2200px;
      perspective-origin:center center;
      overflow:hidden;
    }

    .machine-wrap{
      position:relative;
      width:460px;
      height:760px;
      transform-style:preserve-3d;
      transform:rotateX(12deg) rotateY(-28deg);
      cursor:grab;
      user-select:none;
      transition:transform 0.12s ease-out;
    }

    .machine-wrap:active{ cursor:grabbing; }

    .shadow{
      position:absolute;
      left:50%;
      bottom:-32px;
      width:560px;
      height:180px;
      transform:translateX(-50%) translateZ(-180px);
      background:radial-gradient(ellipse, rgba(0,0,0,0.62), rgba(0,0,0,0));
      filter:blur(28px);
      border-radius:50%;
      z-index:-1;
    }

    .machine{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
    }

    .body{
      position:absolute;
      inset:0;
      border-radius:30px;
      background:
        linear-gradient(145deg, var(--metal1) 0%, #dce5ee 14%, #b9c7d3 28%, #93a3b0 46%, var(--metal3) 100%);
      border:4px solid rgba(12,17,22,0.7);
      box-shadow:
        0 42px 70px rgba(0,0,0,0.5),
        inset 0 0 0 4px rgba(255,255,255,0.34),
        inset 0 -18px 24px rgba(0,0,0,0.18);
      overflow:hidden;
      transform-style:preserve-3d;
    }

    .body::before{
      content:"";
      position:absolute;
      inset:20px 18px 18px 18px;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.03));
      transform:translateZ(18px);
      pointer-events:none;
    }

    .side{
      position:absolute;
      right:-16px;
      top:62px;
      width:28px;
      height:560px;
      border-radius:15px;
      background:linear-gradient(180deg, #d8e2eb 0%, #909ca8 30%, #697684 100%);
      border:2px solid rgba(0,0,0,0.36);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.2);
      transform:rotateY(90deg) translateZ(194px);
      z-index:1;
    }

    .top-bezel{
      position:absolute;
      left:20px;
      right:20px;
      top:18px;
      height:84px;
      border-radius:16px;
      background:linear-gradient(180deg, #eef6ff 0%, #c1d2e1 30%, #7f8b98 100%);
      border:2px solid rgba(0,0,0,0.25);
      box-shadow:
        inset 0 3px 10px rgba(255,255,255,0.8),
        inset 0 -12px 14px rgba(0,0,0,0.07);
      overflow:hidden;
      transform:translateZ(26px);
      z-index:4;
    }

    .top-bezel::before{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.06));
    }

    .led-bar{
      position:absolute;
      left:50%;
      top:28px;
      transform:translateX(-50%);
      width:250px;
      height:14px;
      border-radius:22px;
      background:linear-gradient(90deg, #7df2ff, #ccffff, #7ddfff, #7efcff);
      box-shadow:
        0 0 18px rgba(125,228,255,1),
        inset 0 0 12px rgba(255,255,255,0.42);
      z-index:5;
    }

    .front{
      position:absolute;
      inset:0;
      padding:24px 20px 24px;
      transform:translateZ(26px);
      z-index:3;
    }

    .display{
      position:relative;
      width:100%;
      height:136px;
      border-radius:16px;
      background:linear-gradient(180deg, #0d1a22 0%, #09141a 100%);
      border:2px solid rgba(255,255,255,0.12);
      box-shadow:
        inset 0 0 0 3px rgba(135,228,255,0.10),
        inset 0 0 25px rgba(66,183,255,0.18);
      overflow:hidden;
    }

    .display::before{
      content:"";
      position:absolute;
      inset:0;
      background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 2px,
        transparent 2px,
        transparent 7px
      );
    }

    .screen{
      position:absolute;
      left:16px;
      right:16px;
      top:16px;
      height:72px;
      border-radius:12px;
      background:linear-gradient(180deg, #0f1d2a 0%, #1b2d3b 100%);
      border:1px solid rgba(134,225,255,0.18);
      box-shadow:inset 0 0 18px rgba(122,211,255,0.18);
      display:grid;
      place-items:center;
      font-size:18px;
      letter-spacing:2px;
      font-weight:700;
      text-transform:uppercase;
      color:#d0fbff;
      text-shadow:0 0 16px rgba(117,220,255,0.9);
    }

    .coin-slot{
      width:100%;
      height:22px;
      border-radius:11px;
      background:linear-gradient(180deg, #4a5a67 0%, #141b22 100%);
      box-shadow:inset 0 2px 6px rgba(255,255,255,0.1);
      position:relative;
      margin-top:14px;
    }

    .coin-slot::before{
      content:"";
      position:absolute;
      inset:4px 18px;
      border-radius:7px;
      background:rgba(255,255,255,0.08);
    }

    .product-zone{
      position:relative;
      width:100%;
      margin-top:16px;
      padding-top:4px;
    }

    .rail{
      position:relative;
      width:100%;
      height:178px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(19,31,36,0.85), rgba(11,17,24,0.92));
      border:2px solid rgba(255,255,255,0.09);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.02),
        inset 0 0 22px rgba(91,170,255,0.09);
      overflow:hidden;
    }

    .rail::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0), rgba(255,255,255,0.05));
    }

    .drink-rail{
      position:absolute;
      left:50%;
      top:50%;
      width:100%;
      height:100%;
      transform:translate(-50%, -50%) rotateX(12deg);
      transform-style:preserve-3d;
      animation:floatRail 7s ease-in-out infinite alternate;
    }

    @keyframes floatRail{
      0%{ transform:translate(-50%, -50%) rotateX(12deg) rotateY(0deg); }
      100%{ transform:translate(-50%, -50%) rotateX(12deg) rotateY(9deg); }
    }

    .drink{
      position:absolute;
      left:50%;
      width:92px;
      height:132px;
      transform-style:preserve-3d;
      cursor:pointer;
      transition:transform 0.22s ease, filter 0.22s ease, opacity 0.22s ease;
      user-select:none;
    }

    .drink .can{
      position:absolute;
      left:50%;
      top:0;
      width:72px;
      height:96px;
      transform:translateX(-50%) translateZ(20px);
      border-radius:14px;
      border:3px solid rgba(255,255,255,0.20);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.22),
        0 12px 18px rgba(0,0,0,0.18);
    }

    .drink .can::before{
      content:"";
      position:absolute;
      left:50%;
      top:-12px;
      width:18px;
      height:18px;
      transform:translateX(-50%);
      border-radius:6px 6px 2px 2px;
      background:rgba(245,245,245,0.72);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .drink .label{
      position:absolute;
      left:50%;
      bottom:0;
      width:100%;
      transform:translateX(-50%);
      text-align:center;
      font-size:13px;
      font-weight:700;
      letter-spacing:0.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding:0 6px;
      text-shadow:0 2px 4px rgba(0,0,0,0.25);
    }

    .drink[data-name="Nuke Cola"] .can{
      background:linear-gradient(180deg, #f26a6a 0%, #a40000 100%);
    }

    .drink[data-name="Fanta"] .can{
      background:linear-gradient(180deg, #ffd06c 0%, #ff871f 100%);
    }

    .drink[data-name="Sprite"] .can{
      background:linear-gradient(180deg, #79d9ff 0%, #2877d7 100%);
    }

    .drink[data-name="Eistee"] .can{
      background:linear-gradient(180deg, #8df5c4 0%, #18a863 100%);
    }

    .drink[data-name="Nuke Cola"] .label{ color:#fff2f2; }
    .drink[data-name="Fanta"] .label{ color:#fff7de; }
    .drink[data-name="Sprite"] .label{ color:#f0f9ff; }
    .drink[data-name="Eistee"] .label{ color:#f1fff8; }

    .drink.selected{
      filter:brightness(1.12);
      transform:scale(1.06);
      z-index:10;
    }

    .glass-front{
      position:absolute;
      left:50%;
      bottom:100px;
      width:176px;
      height:118px;
      transform:translateX(-50%) translateZ(26px);
      border-radius:18px 18px 12px 12px;
      background:linear-gradient(180deg, rgba(135,214,255,0.18), rgba(9,16,24,0.62));
      border:3px solid rgba(133,200,255,0.32);
      box-shadow:
        inset 0 0 25px rgba(132,221,255,0.18),
        0 0 22px rgba(92,177,255,0.18);
      overflow:hidden;
      z-index:5;
    }

    .glass-front::before{
      content:"";
      position:absolute;
      inset:9px 10px 10px 10px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.12));
      border:1px solid rgba(255,255,255,0.08);
    }

    .glass-front::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:0;
      width:120px;
      height:18px;
      transform:translateX(-50%);
      background:rgba(5,12,18,0.7);
      border-radius:10px 10px 0 0;
      box-shadow:inset 0 0 10px rgba(255,255,255,0.05);
    }

    .dispensed{
      position:absolute;
      left:50%;
      bottom:-18px;
      width:62px;
      height:86px;
      transform:translateX(-50%);
      border-radius:14px;
      border:3px solid rgba(255,255,255,0.18);
      box-shadow:inset 0 0 0 2px rgba(255,255,255,0.22);
      opacity:0;
      pointer-events:none;
      z-index:9;
    }

    .dispensed[data-name="Nuke Cola"]{ background:linear-gradient(180deg, #f26a6a 0%, #a40000 100%); }
    .dispensed[data-name="Fanta"]{ background:linear-gradient(180deg, #ffd06c 0%, #ff871f 100%); }
    .dispensed[data-name="Sprite"]{ background:linear-gradient(180deg, #79d9ff 0%, #2877d7 100%); }
    .dispensed[data-name="Eistee"]{ background:linear-gradient(180deg, #8df5c4 0%, #18a863 100%); }

    .dispensed.visible{
      opacity:1;
      animation:drop 1.05s ease forwards;
    }

    @keyframes drop{
      0%{
        opacity:1;
        transform:translateX(-50%) translateY(0) scale(0.92);
      }
      30%{
        opacity:1;
        transform:translateX(-50%) translateY(-36px) scale(1.03);
      }
      100%{
        opacity:0;
        transform:translateX(-50%) translateY(-150px) scale(0.92);
      }
    }

    .button-bank{
      position:absolute;
      left:20px;
      right:20px;
      bottom:18px;
      height:80px;
      border-radius:14px;
      background:linear-gradient(180deg, rgba(16,22,29,0.96), rgba(7,11,16,0.98));
      border:2px solid rgba(255,255,255,0.08);
      box-shadow:inset 0 0 14px rgba(255,255,255,0.06);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      z-index:8;
    }

    .choice-btn{
      width:22px;
      height:22px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #effdff 0%, #7cd8ff 52%, #1d7bc9 100%);
      border:2px solid rgba(255,255,255,0.15);
      box-shadow:
        inset 0 0 12px rgba(255,255,255,0.25),
        0 2px 10px rgba(0,0,0,0.22);
      cursor:pointer;
      transition:transform 0.12s ease, box-shadow 0.12s ease;
    }

    .choice-btn:hover{
      transform:scale(1.12);
      box-shadow:
        0 0 18px rgba(126,220,255,0.75),
        inset 0 0 12px rgba(255,255,255,0.35);
    }

    .status{
      position:absolute;
      left:0;
      right:0;
      bottom:8px;
      text-align:center;
      font-size:12px;
      letter-spacing:1.5px;
      color:rgba(225,245,255,0.78);
      z-index:10;
      user-select:none;
    }

    @media (max-width:560px){
      .machine-wrap{ transform:rotateX(10deg) rotateY(-18deg) scale(0.88); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="shadow"></div>

    <div class="machine-wrap" id="machineWrap">
      <div class="machine">
        <div class="body">
          <div class="top-bezel">
            <div class="led-bar"></div>
          </div>

          <div class="front">
            <div class="display">
              <div class="screen" id="screen">SELECT</div>
            </div>

            <div class="coin-slot"></div>

            <div class="product-zone">
              <div class="rail">
                <div class="drink-rail" id="drinkRail">
                  <div class="drink selected" data-name="Nuke Cola" style="top:12px; left:50%; transform:translateX(-50%) rotateY(0deg) translateZ(12px);">
                    <div class="can"></div>
                    <div class="label">Nuke Cola</div>
                  </div>

                  <div class="drink" data-name="Fanta" style="top:12px; left:50%; transform:translateX(-50%) rotateY(92deg) translateZ(54px);">
                    <div class="can"></div>
                    <div class="label">Fanta</div>
                  </div>

                  <div class="drink" data-name="Sprite" style="top:12px; left:50%; transform:translateX(-50%) rotateY(192deg) translateZ(54px);">
                    <div class="can"></div>
                    <div class="label">Sprite</div>
                  </div>

                  <div class="drink" data-name="Eistee" style="top:12px; left:50%; transform:translateX(-50%) rotateY(286deg) translateZ(54px);">
                    <div class="can"></div>
                    <div class="label">Eistee</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="side"></div>

          <div class="glass-front">
            <div class="dispensed" id="dispensed"></div>
          </div>

          <div class="button-bank">
            <div class="choice-btn" data-name="Nuke Cola"></div>
            <div class="choice-btn" data-name="Fanta"></div>
            <div class="choice-btn" data-name="Sprite"></div>
            <div class="choice-btn" data-name="Eistee"></div>
          </div>

          <div class="status" id="status">READY</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const machineWrap = document.getElementById("machineWrap");
    const screen = document.getElementById("screen");
    const status = document.getElementById("status");
    const drinks = [...document.querySelectorAll(".drink")];
    const buttons = [...document.querySelectorAll(".choice-btn")];
    const dispensed = document.getElementById("dispensed");

    let rotationX = 12;
    let rotationY = -28;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function updateMachine(){
      machineWrap.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
    }

    function setSelected(name){
      drinks.forEach(drink => {
        drink.classList.toggle("selected", drink.dataset.name === name);
      });

      screen.textContent = name.toUpperCase();
      status.textContent = "READY";

      dispensed.dataset.name = name;
      dispensed.classList.remove("visible");
      void dispensed.offsetWidth;
      dispensed.classList.add("visible");

      setTimeout(() => dispensed.classList.remove("visible"), 1100);
    }

    drinks.forEach(drink => {
      drink.addEventListener("click", () => setSelected(drink.dataset.name));
      drink.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " "){
          e.preventDefault();
          setSelected(drink.dataset.name);
        }
      });
    });

    buttons.forEach(btn => {
      btn.addEventListener("click", () => setSelected(btn.dataset.name));
    });

    machineWrap.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      machineWrap.setPointerCapture(event.pointerId);
    });

    machineWrap.addEventListener("pointermove", (event) => {
      if(!dragging) return;

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;

      rotationY += dx * 0.35;
      rotationX -= dy * 0.18;
      rotationX = Math.max(-16, Math.min(28, rotationX));

      updateMachine();

      lastX = event.clientX;
      lastY = event.clientY;
    });

    machineWrap.addEventListener("pointerup", () => dragging = false);
    machineWrap.addEventListener("pointerleave", () => dragging = false);

    updateMachine();

    setInterval(() => {
      if(!dragging){
        rotationY += 0.18;
        updateMachine();
      }
    }, 16);

    setSelected("Nuke Cola");
  </script>
</body>
</html>
